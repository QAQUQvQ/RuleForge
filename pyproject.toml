[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ruleforge"
version = "0.1.0"
description = "Evidence-backed SRD 5.1 rules"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
ruleforge = "ruleforge.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
"ruleforge.persistence" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
markers = ["evidence: requires actual successful xParse artifacts"]
